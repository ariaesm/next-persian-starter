<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="1200" height="630" fill="#09090B"/>
  <circle cx="950" cy="200" r="320" fill="#2563EB" fill-opacity="0.18" filter="blur(100px)"/>
  <circle cx="200" cy="450" r="280" fill="#0D9488" fill-opacity="0.12" filter="blur(90px)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="32" stroke="#27272A" stroke-width="2"/>

  <!-- Top Badges -->
  <g transform="translate(80, 85)">
    <rect width="180" height="40" rx="20" fill="#1E3A8A" stroke="#2563EB" stroke-width="1.5"/>
    <text x="90" y="25" fill="#BFDBFE" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">⚡ Next.js 15 Starter</text>
  </g>

  <g transform="translate(280, 85)">
    <rect width="170" height="40" rx="20" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
    <text x="85" y="25" fill="#E4E4E7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">فونت وزیرمتن + RTL</text>
  </g>

  <g transform="translate(470, 85)">
    <rect width="180" height="40" rx="20" fill="#064E3B" stroke="#059669" stroke-width="1.5"/>
    <text x="90" y="25" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🔍 موتور کامل SEO</text>
  </g>

  <!-- Title -->
  <text x="80" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">
    next-persian-starter
  </text>

  <!-- Persian Subtitle -->
  <text x="80" y="315" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">
    استارتر کیت آماده تولید Next.js 15 با تایپ‌اسکریپت و راست‌چین
  </text>

  <!-- Description paragraph -->
  <text x="80" y="375" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    شامل چیدمان کامل راست‌چین (RTL)، جعبه‌ابزار فرم‌ها و ابزارهای فارسی (کد ملی، شبا، کارت)،
  </text>
  <text x="80" y="410" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    نقشه سایت و روبات‌های داینامیک، دارک مود اتوماتیک، و قابلیت دیپلوی با یک کلیک در Vercel.
  </text>

  <!-- Bottom Details -->
  <g transform="translate(80, 500)">
    <!-- Terminal Command -->
    <rect width="470" height="54" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <text x="24" y="34" fill="#3B82F6" font-family="monospace" font-size="18" font-weight="700">$</text>
    <text x="44" y="34" fill="#34D399" font-family="monospace" font-size="16" font-weight="600">npx create-next-app -e ariaesm/next-persian-starter</text>
  </g>

  <!-- Author Info -->
  <g transform="translate(860, 510)">
    <text x="260" y="18" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="15" text-anchor="end">Created by</text>
    <text x="260" y="42" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="end">Aria Esmaeilzadeh (@ariaesm)</text>
  </g>
</svg>
